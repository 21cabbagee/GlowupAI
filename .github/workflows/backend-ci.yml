name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install black mypy bandit pytest-cov

      - name: Check code formatting with Black
        working-directory: backend
        run: black --check --diff skinproof tests

      - name: Type checking with Mypy
        working-directory: backend
        run: |
          mypy skinproof --ignore-missing-imports --no-strict-optional || true

      - name: Security scan with Bandit
        working-directory: backend
        run: |
          bandit -r skinproof -f json -o bandit-report.json || true
          bandit -r skinproof

      - name: Run pytest with coverage
        working-directory: backend
        env:
          SKINPROOF_RATE_LIMIT_ENABLED: "0"
        run: |
          pytest tests/ \
            --cov=skinproof \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junit-xml=pytest-report.xml \
            -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-py${{ matrix.python-version }}
          path: |
            backend/pytest-report.xml
            backend/htmlcov/
          retention-days: 7

      - name: Upload Security Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-scan-py${{ matrix.python-version }}
          path: backend/bandit-report.json
          retention-days: 7

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const buildStatus = '${{ job.status }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            let comment = `## 🐍 Backend CI Results (Python ${{ matrix.python-version }})\n\n`;
            comment += `**Status:** ${buildStatus === 'success' ? '✅' : '❌'} ${buildStatus.toUpperCase()}\n\n`;
            comment += `### Build Summary\n`;
            comment += `- **Black (Formatting):** ${{ steps.black.outcome || 'N/A' }}\n`;
            comment += `- **Mypy (Type Checking):** ${{ steps.mypy.outcome || 'N/A' }}\n`;
            comment += `- **Bandit (Security):** ${{ steps.bandit.outcome || 'N/A' }}\n`;
            comment += `- **Pytest:** ${{ steps.pytest.outcome || 'N/A' }}\n\n`;
            comment += `[View Full Report](${runUrl})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: glowup-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm glowup-backend:test python -c "import skinproof; print('Import successful')"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: glowup_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: glowup_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://glowup_test:test_password@localhost:5432/glowup_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-32-bytes-long
          SKINPROOF_RATE_LIMIT_ENABLED: "0"
        run: |
          pytest tests/ -v -m "integration or not unit" || echo "No integration tests found"
