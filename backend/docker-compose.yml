services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skinproof
      POSTGRES_USER: skinproof
      POSTGRES_PASSWORD: skinproof
    ports:
      - "5432:5432"
    volumes:
      - skinproof-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinproof -d skinproof"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skinproof:skinproof@postgres:5432/skinproof
      SKINPROOF_ENV: production
      SKINPROOF_DISABLE_LEGACY_KEY_FILE: "1"
      # Gemini is off by default for this local compose stack because no
      # GEMINI_API_KEY is provided here; shelf-scan/Q&A degrade gracefully.
      # Pass GEMINI_API_KEY (and drop this line, or set it to "1") to test
      # the Gemini-backed paths against real Postgres.
      SKINPROOF_GEMINI_ENABLED: "0"
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  skinproof-postgres:
