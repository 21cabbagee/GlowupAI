<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffc629">

<body>
  <div id="app" aria-live="polite">
    <main class="onboarding-shell">
      <div class="onboarding-inner text-center">
        <a class="wordmark" href="/" aria-label="SkinProof home">Skin<em>Proof</em></a>
        <div class="profile-mark" style="margin:48px auto 28px" aria-hidden="true">SP</div>
        <p class="eyebrow">YOUR PRIVATE SPACE</p>

        <p class="lead" style="margin-inline:auto">Bringing your profile and evidence together.</p>
