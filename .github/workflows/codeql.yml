name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * 1'  # Run every Monday at 6 AM UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # Don't fail workflow if analysis has issues

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Set up JDK 17 (for Kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        continue-on-error: true
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Grant execute permission (for Kotlin)
        if: matrix.language == 'java-kotlin'
        run: chmod +x gradlew
        continue-on-error: true

      - name: Validate Gradle
        if: matrix.language == 'java-kotlin'
        run: ./gradlew tasks --no-daemon
        continue-on-error: true

      - name: Build with Gradle (for Kotlin)
        if: matrix.language == 'java-kotlin'
        timeout-minutes: 15
        continue-on-error: true
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:${{matrix.language}}"
