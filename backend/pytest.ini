[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for individual components
    integration: Integration tests for complete flows
    slow: Slow-running tests (load tests, long-running operations)

addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Coverage options
[coverage:run]
source = glowupai
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
