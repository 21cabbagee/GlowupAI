name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISTRIBUTION_SUPABASE_URL: ${{ secrets.RELEASE_SUPABASE_URL }}
      DISTRIBUTION_SUPABASE_ANON_KEY: ${{ secrets.RELEASE_SUPABASE_ANON_KEY }}
      DISTRIBUTION_GOOGLE_WEB_CLIENT_ID: ${{ secrets.RELEASE_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        id: lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests
        id: test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile Debug APK
        id: build
        run: ./gradlew assembleDebug --stacktrace

      - name: Build installable Vercel Debug APK
        id: distribution-build
        if: env.DISTRIBUTION_SUPABASE_URL != '' && env.DISTRIBUTION_SUPABASE_ANON_KEY != '' && env.DISTRIBUTION_GOOGLE_WEB_CLIENT_ID != ''
        env:
          DEBUG_API_BASE_URL: https://backend-piyushcapitals-4171.vercel.app/api/
          DEBUG_SUPABASE_URL: ${{ env.DISTRIBUTION_SUPABASE_URL }}
          DEBUG_SUPABASE_ANON_KEY: ${{ env.DISTRIBUTION_SUPABASE_ANON_KEY }}
          DEBUG_GOOGLE_WEB_CLIENT_ID: ${{ env.DISTRIBUTION_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Report unavailable installable APK
        if: env.DISTRIBUTION_SUPABASE_URL == '' || env.DISTRIBUTION_SUPABASE_ANON_KEY == '' || env.DISTRIBUTION_GOOGLE_WEB_CLIENT_ID == ''
        run: echo "::notice::Production Supabase/Google build values are not configured; refusing to publish a localhost-only APK."

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Debug APK
        if: steps.distribution-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const buildStatus = '${{ job.status }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            let comment = `## 🤖 Android CI Results\n\n`;
            comment += `**Status:** ${buildStatus === 'success' ? '✅' : '❌'} ${buildStatus.toUpperCase()}\n\n`;
            comment += `### Build Summary\n`;
            comment += `- **Lint:** ${{ steps.lint.outcome || 'N/A' }}\n`;
            comment += `- **Unit Tests:** ${{ steps.test.outcome || 'N/A' }}\n`;
            comment += `- **APK Build:** ${{ steps.build.outcome || 'N/A' }}\n\n`;
            comment += `[View Full Report](${runUrl})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  instrumentation-test-build:
    name: Compile Instrumentation Tests (No Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Keep CI emulator-free. Runtime instrumentation is performed only on an explicitly
      # connected physical device; CI still compiles both APKs so test/source drift fails fast.
      - name: Compile app and instrumentation test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload Instrumentation APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Code Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 7
