[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinproof"
version = "3.0.0"
description = "A complete privacy-conscious personal appearance evidence workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pillow>=10.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "cryptography>=42.0",
  "google-genai>=1.0.0",
  "psycopg[binary,pool]>=3.2",
  "PyJWT[crypto]>=2.8",
  "redis>=5.0.0",
  "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.27",
  "black>=23.0.0",
  "mypy>=1.5.0",
  "bandit>=1.7.5",
  "safety>=2.3.0",
  "locust>=2.15.0"
]
otel = [
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-instrumentation-fastapi>=0.41b0",
  "opentelemetry-exporter-otlp>=1.20.0"
]

[project.scripts]
skinproof = "skinproof.cli:main"

[tool.setuptools.packages.find]
include = ["skinproof*"]

[tool.setuptools.package-data]
skinproof = ["static/*.html", "static/*.css", "static/*.js", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow tests (load tests)",
]
addopts = "--strict-markers -v"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["skinproof"]
omit = [
  "*/tests/*",
  "*/venv/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
