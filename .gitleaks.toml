# GlowupAI Gitleaks Configuration
# Allowlists for false positives in documentation and examples

title = "GlowupAI Secret Scanning Config"

# Global allowlist for documentation, templates, CI fixtures, and placeholders.
# These are allowlists, rather than custom detection rules, so normal identifiers
# such as `password` and `token` are not reported as leaked secrets.
[allowlist]
description = "Global allowlists for common false positives"
regexes = [
    '''REDACTED''',
    '''<generate-.*>''',
    '''<base64-encoded-.*>''',
    '''example[_-]?token''',
    '''test[_-]?(token|key|secret)''',
    '''test_password''',
    '''test-secret-key-for-ci''',
    '''test-encryption-key-32-bytes-long''',
    '''Bearer\s+test''',
]
paths = [
    '''.*\.md$''',              # All markdown documentation
    '''.*\.example$''',         # All example files
    '''.*_test\..*$''',         # Test files
    '''.*/tests?/.*$''',        # Test directories
    '''.*\.env\..*\.template$''',
    '''\.github/workflows/backend-ci\.yml$''',
    '''RENDER_ADMIN_TOKEN\.txt$''',
    '''my-session\.md$''',
]
